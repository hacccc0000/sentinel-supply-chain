services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: supplychain
      POSTGRES_USER: supplychain
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supplychain -d supplychain"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    image: sap-supply-chain-api:local
    build:
      context: ./backend
    environment:
      APP_ENV: development
      AUTH_MODE: development
      DATABASE_URL: postgresql+psycopg://supplychain:${POSTGRES_PASSWORD}@postgres:5432/supplychain
      CORS_ORIGINS: http://localhost:8080
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: sap-supply-chain-web:local
    build:
      context: ./frontend
    environment:
      API_URL: http://localhost:${API_PORT:-8000}
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
