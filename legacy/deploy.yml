name: Test, publish, and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

env:
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/sentinel-supply-chain-api
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/sentinel-supply-chain-web
  IMAGE_TAG: ${{ github.sha }}

jobs:
  validate:
    name: Test application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install API dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Test API
        working-directory: backend
        run: python -m pytest
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=moderate
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Build API image
        run: docker build --tag sap-supply-chain-api:test ./backend
      - name: Build web image
        run: docker build --tag sap-supply-chain-web:test ./frontend

  publish:
    name: Publish private GHCR images
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sign in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.API_IMAGE }}:latest
      - name: Publish web image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.WEB_IMAGE }}:latest

  deploy:
    name: Provision isolated pilot and deploy
    needs: publish
    runs-on: ubuntu-latest
    environment: pilot
    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      DEPLOYMENT_PRINCIPAL_OBJECT_ID: ${{ vars.DEPLOYMENT_PRINCIPAL_OBJECT_ID }}
      ENTRA_TENANT_ID: ${{ vars.ENTRA_TENANT_ID }}
      ENTRA_CLIENT_ID: ${{ vars.ENTRA_CLIENT_ID }}
      API_SCOPE: ${{ vars.API_SCOPE }}
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
      POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify deployment configuration is complete
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$AZURE_RESOURCE_GROUP" ]] || { echo "::error::Missing AZURE_RESOURCE_GROUP"; exit 1; }
          [[ -n "$AZURE_LOCATION" ]] || { echo "::error::Missing AZURE_LOCATION"; exit 1; }
          [[ -n "$AZURE_SUBSCRIPTION_ID" ]] || { echo "::error::Missing AZURE_SUBSCRIPTION_ID"; exit 1; }
          [[ -n "$AZURE_TENANT_ID" ]] || { echo "::error::Missing AZURE_TENANT_ID"; exit 1; }
          [[ -n "$AZURE_CLIENT_ID" ]] || { echo "::error::Missing AZURE_CLIENT_ID"; exit 1; }
          [[ -n "$DEPLOYMENT_PRINCIPAL_OBJECT_ID" ]] || { echo "::error::Missing DEPLOYMENT_PRINCIPAL_OBJECT_ID"; exit 1; }
          [[ -n "$ENTRA_TENANT_ID" ]] || { echo "::error::Missing ENTRA_TENANT_ID"; exit 1; }
          [[ -n "$ENTRA_CLIENT_ID" ]] || { echo "::error::Missing ENTRA_CLIENT_ID"; exit 1; }
          [[ -n "$API_SCOPE" ]] || { echo "::error::Missing API_SCOPE"; exit 1; }
          [[ -n "$GHCR_USERNAME" ]] || { echo "::error::Missing GHCR_USERNAME"; exit 1; }
          [[ -n "$GHCR_READ_TOKEN" ]] || { echo "::error::Missing GHCR_READ_TOKEN"; exit 1; }
          [[ -n "$POSTGRES_ADMIN_PASSWORD" ]] || { echo "::error::Missing POSTGRES_ADMIN_PASSWORD"; exit 1; }
      - name: Sign in to Azure using GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: Create or verify the dedicated resource group
        shell: bash
        run: |
          set -euo pipefail
          exists="$(az group exists --name "$AZURE_RESOURCE_GROUP")"
          if [[ "$exists" == "true" ]]; then
            owner="$(az group show --name "$AZURE_RESOURCE_GROUP" --query "tags.application" -o tsv)"
            if [[ "$owner" != "sap-supply-chain-security" ]]; then
              echo "::error::Refusing to use an existing resource group not tagged for this application."
              exit 1
            fi
          else
            az group create --name "$AZURE_RESOURCE_GROUP" --location "$AZURE_LOCATION" \
              --tags application=sap-supply-chain-security managedBy=github-actions environment=pilot \
              --output none
          fi
      - name: Preview Azure resource changes
        shell: bash
        run: |
          set -euo pipefail
          az deployment group what-if \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "sapsc-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --template-file infra/main.bicep \
            --parameters \
              location="$AZURE_LOCATION" \
              githubOwner="${GITHUB_REPOSITORY_OWNER,,}" \
              imageTag="$IMAGE_TAG" \
              ghcrUsername="$GHCR_USERNAME" \
              ghcrReadToken="$GHCR_READ_TOKEN" \
              postgresAdminPassword="$POSTGRES_ADMIN_PASSWORD" \
              entraTenantId="$ENTRA_TENANT_ID" \
              entraClientId="$ENTRA_CLIENT_ID" \
              apiScope="$API_SCOPE" \
              deploymentPrincipalObjectId="$DEPLOYMENT_PRINCIPAL_OBJECT_ID"
      - name: Deploy Azure resources
        shell: bash
        run: |
          set -euo pipefail
          az deployment group create \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "sapsc-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --template-file infra/main.bicep \
            --parameters \
              location="$AZURE_LOCATION" \
              githubOwner="${GITHUB_REPOSITORY_OWNER,,}" \
              imageTag="$IMAGE_TAG" \
              ghcrUsername="$GHCR_USERNAME" \
              ghcrReadToken="$GHCR_READ_TOKEN" \
              postgresAdminPassword="$POSTGRES_ADMIN_PASSWORD" \
              entraTenantId="$ENTRA_TENANT_ID" \
              entraClientId="$ENTRA_CLIENT_ID" \
              apiScope="$API_SCOPE" \
              deploymentPrincipalObjectId="$DEPLOYMENT_PRINCIPAL_OBJECT_ID" \
            --query properties.outputs \
            --output json > "$RUNNER_TEMP/deployment-outputs.json"
      - name: Store database URL in Key Vault and start apps
        shell: bash
        run: |
          set -euo pipefail
          vault="$(python -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"]+"/deployment-outputs.json"))["keyVaultName"]["value"])')"
          host="$(python -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"]+"/deployment-outputs.json"))["postgresHost"]["value"])')"
          user="$(python -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"]+"/deployment-outputs.json"))["postgresAdminUser"]["value"])')"
          database_url="$(DB_USER="$user" DB_HOST="$host" POSTGRES_ADMIN_PASSWORD="$POSTGRES_ADMIN_PASSWORD" python - <<'PY'
          import os
          from urllib.parse import quote
          username = quote(os.environ["DB_USER"], safe="")
          password = quote(os.environ["POSTGRES_ADMIN_PASSWORD"], safe="")
          print(f"postgresql+psycopg://{username}:{password}@{os.environ['DB_HOST']}:5432/supplychain?sslmode=verify-full")
          PY
          )"
          for attempt in {1..12}; do
            if az keyvault secret set --vault-name "$vault" --name database-url --value "$database_url" --output none; then
              break
            fi
            if [[ "$attempt" == 12 ]]; then
              echo "::error::Unable to write database connection secret to the application Key Vault."
              exit 1
            fi
            sleep 10
          done
          api="$(python -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"]+"/deployment-outputs.json"))["apiAppName"]["value"])')"
          web="$(python -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"]+"/deployment-outputs.json"))["webAppName"]["value"])')"
          az webapp restart --resource-group "$AZURE_RESOURCE_GROUP" --name "$api"
          az webapp restart --resource-group "$AZURE_RESOURCE_GROUP" --name "$web"
      - name: Show deployed endpoints
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          outputs = json.load(open(os.environ["RUNNER_TEMP"] + "/deployment-outputs.json"))
          print("API:", outputs["apiUrl"]["value"])
          print("Web:", outputs["webUrl"]["value"])
          print("PostgreSQL SKU:", outputs["postgresSku"]["value"])
          print("App Service SKU:", outputs["appServicePlanSku"]["value"])
          PY
